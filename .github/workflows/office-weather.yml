name: office-display data
# Runner and action versions verified 2026-09-21: actions/checkout v6 and actions/setup-python v6 run on Node 24
# (v4/v5 target the deprecated Node 20); ubuntu-24.04 is pinned because the ubuntu-latest label migrates to
# Ubuntu 26 on 2026-10-19. Re-check both before October 2026 (see DEPENDENCY-REVIEW.md).
on:
  schedule:
    - cron: "*/15 * * * *"        # offices: MET forecast + station reading + radar (free, public; no keys)
    - cron: "23 */3 * * *"        # + ECMWF grids + NDBC buoy mirror
    - cron: "41 4 * * *"          # + meteor detections aggregate (daily)
  workflow_dispatch: {}           # manual run = everything
permissions: { contents: read }
concurrency: { group: office-display-data, cancel-in-progress: true }
env:
  PYTHONUNBUFFERED: "1"
jobs:
  fetch-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - name: Check the HubSpot credential is present
        env:
          HUBSPOT_SERVICE_KEY: ${{ secrets.HUBSPOT_SERVICE_KEY }}
          HUBSPOT_PRIVATE_APP_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
        run: |
          if [ -z "$HUBSPOT_SERVICE_KEY" ] && [ -z "$HUBSPOT_PRIVATE_APP_TOKEN" ]; then
            echo "::error title=Missing credential::No HubSpot credential found. Add a repository secret named HUBSPOT_SERVICE_KEY (HubSpot -> Development -> Keys -> Service keys, scope 'files'). Settings -> Secrets and variables -> Actions -> New repository secret. A legacy private-app token also works under the name HUBSPOT_PRIVATE_APP_TOKEN."
            exit 1
          fi
          echo "credential present (${#HUBSPOT_SERVICE_KEY} / ${#HUBSPOT_PRIVATE_APP_TOKEN} chars)"
      - run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Fetch
        working-directory: backend
        env:
          OFFICES: offices.json
          POINTS_FILE: grid-points.json
          SKIP_GRIDS:      ${{ github.event.schedule == '*/15 * * * *' && '1' || '0' }}
          PUBLISH_NDBC:    ${{ github.event.schedule == '*/15 * * * *' && '0' || '1' }}
          PUBLISH_METEORS: ${{ (github.event.schedule == '41 4 * * *' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
        run: python3 office_weather.py
      - name: Publish to HubSpot Files (Service Key with the files scope; a legacy private-app token also works)
        working-directory: backend
        env:
          HUBSPOT_SERVICE_KEY: ${{ secrets.HUBSPOT_SERVICE_KEY }}
          HUBSPOT_PRIVATE_APP_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
          HUBSPOT_FOLDER: Office_Screen
        run: |
          FILES="office-weather.json"
          for f in office-fields.json ndbc-latest_obs.txt meteors.json; do [ -f "$f" ] && FILES="$FILES $f"; done
          python3 hubspot_upload.py $FILES
